name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a01b73-my-tank-game
    paths:
      - '.github/workflows/android-debug.yml'
      - 'android/**'
      - 'assets/**'
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.mjs'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Tank Realms
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run source and offline-build checks
        run: npm run check

      - name: Copy offline web build into Android
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TankRealms-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
